<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaathiGhar | Savitri Ji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #121212;
    --card-bg: #1E1E1E;
    --text-main: #FFFFFF;
    --text-muted: #B0B0B0;
    --primary: #F0C040;
    --blue: #4D90FE;
    --green: #27AE60;
    --red: #E74C3C;
    --spacing: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-size: 24px; /* Minimum 22px as per spec */
  }
  
  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--spacing);
    background: var(--card-bg);
    border-bottom: 2px solid #333;
  }
  .greeting {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .avatar {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: var(--primary);
    color: #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem;
  }
  .greeting-text h1 {
    font-size: 32px; /* Minimum 32px as per spec */
    margin-bottom: 8px;
    color: var(--primary);
  }
  .greeting-text p {
    font-size: 24px;
  }
  .weather-widget {
    text-align: right;
  }
  .weather-temp { font-size: 36px; font-weight: 900; }
  .weather-desc { font-size: 22px; color: var(--text-muted); }

  /* Main Action Grid */
  .main-actions {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: var(--spacing);
    padding: var(--spacing);
  }
  .action-btn {
    border: none;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 36px;
    color: #000;
    cursor: pointer;
    transition: transform 0.2s;
    text-decoration: none;
  }
  .action-btn:active { transform: scale(0.95); }
  .action-btn .icon { font-size: 80px; }

  .btn-call { background: var(--green); color: #fff; }
  .btn-photos { background: var(--blue); color: #fff; }
  .btn-ai { background: var(--primary); color: #000; }
  .btn-sos { background: var(--red); color: #fff; }

  /* Modal/Overlays */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .overlay.active { display: flex; }
  .sos-content {
    text-align: center;
  }
  .sos-content h1 { font-size: 64px; color: var(--red); margin-bottom: 40px; }
  .sos-timer { font-size: 120px; font-weight: 900; margin-bottom: 40px; }
  .btn-cancel {
    background: #333; color: #fff;
    border: 4px solid #555;
    font-size: 32px; font-weight: 800;
    padding: 20px 60px;
    border-radius: 20px;
    cursor: pointer;
  }

  /* Audio Message Overlay */
  .dadi-ai-content { text-align: center; }
  .ai-orb {
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--primary) 0%, #000 100%);
    margin: 0 auto 40px;
    animation: pulse 2s infinite alternate;
  }
  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.8; }
    100% { transform: scale(1.1); opacity: 1; }
  }
  .dadi-ai-content h2 { font-size: 48px; color: var(--primary); margin-bottom: 20px; }
  .dadi-ai-content p { font-size: 32px; color: #fff; }
  .btn-close-ai { margin-top: 60px; }

</style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="greeting">
      <div class="avatar">&#128117;</div>
      <div class="greeting-text">
        <h1>Namaste, Savitri Ji.</h1>
        <p>Aaj ka din shubh ho.</p>
      </div>
    </div>
    <div class="weather-widget">
      <div class="weather-temp">&#9728;&#65039; 28&deg;C</div>
      <div class="weather-desc">Sunny in Jaipur</div>
    </div>
  </header>

  <!-- Main Grid (Max 4 Options) -->
  <main class="main-actions">
    <button class="action-btn btn-call" onclick="showCalling()">
      <span class="icon">&#128222;</span>
      <span>Call My Family</span>
    </button>
    
    <a href="elderly-photos.html" class="action-btn btn-photos">
      <span class="icon">&#128247;</span>
      <span>See Photos</span>
    </a>
    
    <button class="action-btn btn-ai" onclick="showDadiAI()">
      <span class="icon">&#129302;</span>
      <span>Talk to Dadi AI</span>
    </button>
    
    <button class="action-btn btn-sos" onclick="triggerSOS()">
      <span class="icon">&#128680;</span>
      <span>I Need Help</span>
    </button>
  </main>

  <!-- SOS Overlay -->
  <div class="overlay" id="sosOverlay">
    <div class="sos-content">
      <h1>SENDING ALERT TO STAFF...</h1>
      <p style="font-size: 32px; margin-bottom: 20px;">Help is coming. Please wait.</p>
      <div class="sos-timer" id="sosTimer">05:00</div>
      <button class="btn-cancel" onclick="cancelSOS()">Undo / Cancel Alert</button>
    </div>
  </div>

  <!-- Dadi AI Overlay -->
  <div class="overlay" id="aiOverlay">
    <div class="dadi-ai-content">
      <div class="ai-orb"></div>
      <h2>Dadi AI is listening...</h2>
      <p>Speak now, Savitri Ji.</p>
      <button class="btn-cancel btn-close-ai" onclick="closeDadiAI()">Stop & Close</button>
    </div>
  </div>

  <script>
    // SOS Logic
    let sosInterval;
    let secondsLeft = 300;
    function triggerSOS() {
      document.getElementById('sosOverlay').classList.add('active');
      secondsLeft = 300;
      updateTimerDisplay();
      sosInterval = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay();
        if(secondsLeft <= 0) clearInterval(sosInterval);
      }, 1000);
      
      // Voice Output
      speakText("Sending alert to staff. Help is coming.");
    }
    function cancelSOS() {
      document.getElementById('sosOverlay').classList.remove('active');
      clearInterval(sosInterval);
      speakText("Alert cancelled.");
    }
    function updateTimerDisplay() {
      const mins = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
      const secs = (secondsLeft % 60).toString().padStart(2, '0');
      document.getElementById('sosTimer').innerText = `${mins}:${secs}`;
    }

    // Dadi AI Logic
    function showDadiAI() {
      document.getElementById('aiOverlay').classList.add('active');
      speakText("Namaste Savitri Ji. Tell me about your day.");
    }
    function closeDadiAI() {
      document.getElementById('aiOverlay').classList.remove('active');
      window.speechSynthesis.cancel();
    }

    // Calling Logic
    function showCalling() {
      alert("Opening video call to Primary Family Contact (Ramesh Ji)...");
      speakText("Calling your son, Ramesh.");
    }

    // Basic Voice Output
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop current speech
        const msg = new SpeechSynthesisUtterance(text);
        // Try to pick a female Hindi voice if available, else default
        let voices = window.speechSynthesis.getVoices();
        let hindiVoice = voices.find(v => v.lang.includes('hi-IN'));
        if(hindiVoice) msg.voice = hindiVoice;
        window.speechSynthesis.speak(msg);
      }
    }
  </script>
</body>
</html>
