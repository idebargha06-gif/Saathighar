<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaathiGhar | Memory Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0E3A54; /* SaathiGhar teal-dark */
    --card-bg: #1A5276; /* SaathiGhar teal */
    --text-main: #FFFFFF;
    --text-muted: #D4ECF7;
    --primary: #F0C040; /* SaathiGhar gold-light */
    --saffron: #E8700A;
    --spacing: 32px;
    --red: #E74C3C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg-dark);
    background-image: radial-gradient(circle at top right, rgba(232, 112, 10, 0.15), transparent 40%);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-size: 24px;
  }
  
  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--spacing) 40px;
    background: rgba(26, 82, 118, 0.6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .btn-back {
    background: rgba(255,255,255,0.1);
    border: 3px solid rgba(255,255,255,0.2);
    color: var(--primary);
    font-size: 32px;
    font-weight: 900;
    padding: 16px 40px;
    border-radius: 40px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    text-decoration: none;
    display: flex; align-items: center; gap: 10px;
    transition: background 0.2s;
  }
  .btn-back:hover { background: rgba(255,255,255,0.2); }
  .top-bar h1 { font-size: 44px; font-family: 'Playfair Display', serif; color: var(--primary); }

  /* Photos Scroll */
  .photos-container {
    flex: 1;
    overflow-y: auto;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 50px;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
  }
  .photo-card {
    background: var(--card-bg);
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .photo-img {
    width: 100%;
    height: 500px;
    object-fit: cover;
    background: #333;
  }
  .photo-info {
    padding: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .photo-text h2 { font-size: 36px; color: var(--primary); margin-bottom: 10px; }
  .photo-text p { font-size: 28px; color: var(--text-muted); }
  
  .photo-actions {
    display: flex;
    gap: 20px;
  }
  .btn-action {
    width: 100px; height: 100px;
    border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .btn-action:active { transform: scale(0.9); }
  .btn-play { background: #4D90FE; color: #fff; }
  .btn-react { background: transparent; border: 4px solid var(--red); color: var(--red); }
  .btn-react.liked { background: var(--red); color: #fff; }
  .btn-voice { background: var(--saffron); color: #fff; }
  
  /* Voice Reply Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .overlay.active { display: flex; }
  .mic-btn {
    width: 200px; height: 200px;
    border-radius: 50%;
    background: var(--red);
    color: #fff;
    font-size: 80px;
    border: none;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 40px;
  }
  .mic-btn.recording { animation: pulse 1s infinite alternate; }
  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
    100% { transform: scale(1.1); box-shadow: 0 0 0 30px rgba(231, 76, 60, 0); }
  }
  .btn-cancel {
    background: transparent; color: var(--text-muted);
    border: 4px solid var(--text-muted);
    font-size: 32px; font-weight: 800;
    padding: 20px 60px;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 40px;
  }
</style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <a href="elderly-dashboard.html" class="btn-back"><span>&#8592;</span> Back</a>
    <h1>Memory Wall</h1>
    <div style="width: 200px;"></div> <!-- Spacer -->
  </header>

  <!-- Photos -->
  <main class="photos-container">
    
    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=1200&auto=format&fit=crop" alt="Family Photo" class="photo-img">
      <div class="photo-info">
        <div class="photo-text">
          <h2>Ramesh (Son)</h2>
          <p>Today, 10:30 AM</p>
        </div>
        <div class="photo-actions">
          <button class="btn-action btn-play" onclick="playAudio('Namaste Maa. See the new park near our house.')" title="Play Voice Message">&#9654;</button>
          <button class="btn-action btn-react" onclick="toggleReact(this)" title="Send Love">&#10084;</button>
          <button class="btn-action btn-voice" onmousedown="startVoiceReply()" onmouseup="sendVoiceReply()" ontouchstart="startVoiceReply()" ontouchend="sendVoiceReply()" title="Hold to Reply">&#127897;</button>
        </div>
      </div>
    </div>

    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1609220136736-443140cffec6?q=80&w=1200&auto=format&fit=crop" alt="Family Photo" class="photo-img">
      <div class="photo-info">
        <div class="photo-text">
          <h2>Priya (Granddaughter)</h2>
          <p>Yesterday</p>
        </div>
        <div class="photo-actions">
          <button class="btn-action btn-play" onclick="playAudio('Hi Dadi! I got an A on my math test today!')" title="Play Voice Message">&#9654;</button>
          <button class="btn-action btn-react liked" onclick="toggleReact(this)" title="Send Love">&#10084;</button>
          <button class="btn-action btn-voice" onmousedown="startVoiceReply()" onmouseup="sendVoiceReply()" ontouchstart="startVoiceReply()" ontouchend="sendVoiceReply()" title="Hold to Reply">&#127897;</button>
        </div>
      </div>
    </div>

  </main>

  <!-- Voice Reply Overlay (Appears while holding) -->
  <div class="overlay" id="voiceOverlay">
    <div style="text-align: center;">
      <div class="mic-btn recording">&#127897;</div>
      <h2 style="font-size: 40px; color: var(--primary);">Recording your reply...</h2>
      <p style="font-size: 28px; margin-top: 20px;">Release button to send.</p>
    </div>
  </div>

  <script>
    function toggleReact(btn) {
      btn.classList.toggle('liked');
      if (btn.classList.contains('liked')) {
        speakText("Love sent to family.");
      }
    }

    function startVoiceReply() {
      document.getElementById('voiceOverlay').classList.add('active');
    }

    function sendVoiceReply() {
      document.getElementById('voiceOverlay').classList.remove('active');
      speakText("Voice message sent to family.");
    }

    function playAudio(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        let voices = window.speechSynthesis.getVoices();
        let hindiVoice = voices.find(v => v.lang.includes('hi-IN'));
        if(hindiVoice) msg.voice = hindiVoice;
        window.speechSynthesis.speak(msg);
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(msg);
      }
    }
  </script>
</body>
</html>
